_target_: fastwam.runtime.create_fastwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: true
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal" # default
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_action: 1.0
  lambda_video: 1.0
  auxiliary:
    depth: 0.1
    bbox: 0.1
    mask: 0.1
    trajectory: 0.1

# Training-only independent spatial experts. `enabled: false` is the exact
# FastWAM baseline: no auxiliary modules/tokens/losses are constructed.
auxiliary:
  enabled: false
  compute_auxiliary: true
  common:
    # The horizontal LIBERO canvas is [agentview, wrist]. Auxiliary queries
    # condition on agentview Video K/V only; Action keeps both cameras.
    conditioning_num_cameras: 2
    hidden_dim: 256
    ffn_dim: 1024
    max_frames: 64
    max_tokens: 4096
    use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  depth:
    enabled: false
    conditioning_camera_indices: [0]
    init_from_video_dit: false
    # Keep one MoT query per frame, then fuse the final 7x7 agentview Video
    # token grid into a learned 14x14 feature map and progressively decode it.
    output_size: [224, 224]
    decoder_dim: 64
    decoder_grid: [14, 14]
    alpha_grad: 0.5
  bbox:
    enabled: false
    conditioning_camera_indices: [0]
    init_from_video_dit: false
    num_queries: 16
    num_classes: 1
    beta_l1: 5.0
    beta_giou: 2.0
  mask:
    enabled: false
    conditioning_camera_indices: [0]
    init_from_video_dit: false
    num_queries: 16
    output_size: [128, 128]
    mask_dim: 32
    feature_grid: [8, 8]
    beta_dice: 1.0
  trajectory:
    enabled: false
    conditioning_camera_indices: [0]
    init_from_video_dit: false
    # ATM LIBERO default: 32 first-frame-visible tracks per enabled view.
    num_points: 32
    horizon: null
    track_patch_size: 4
    beta_vis: 1.0
